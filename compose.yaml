services:
  backend:
    build:
      context: .\backend
      dockerfile: Dockerfile
    env_file:
      - .\backend\.env
    ports:
      - "127.0.0.1:8081:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .\frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped
